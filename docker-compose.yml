
services:
  bridge-api:
    build: .
    restart: unless-stopped
    command: sh -c "npx prisma db push --skip-generate --schema=prisma/postgres/schema.prisma && node dist/server.js"
    env_file: .env
    environment:
      - DATABASE_PROVIDER=postgres
      - DATABASE_URL=postgresql://bridge_user:bridge_pass@postgres:5432/bridge?schema=public
      - REDIS_URL=redis://redis:6379
    ports:
      - "127.0.0.1:3000:3000" # Expose only to localhost for reverse proxy (Caddy/Nginx)
    volumes:
      - ./audit_logs:/app/audit_logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bridge_net

  bridge-worker:
    build: .
    restart: unless-stopped
    command: node dist/worker.js
    env_file: .env
    environment:
      - DATABASE_PROVIDER=postgres
      - DATABASE_URL=postgresql://bridge_user:bridge_pass@postgres:5432/bridge?schema=public
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./audit_logs:/app/audit_logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bridge_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bridge_user
      POSTGRES_PASSWORD: bridge_pass
      POSTGRES_DB: bridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bridge_user -d bridge" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bridge_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    networks:
      - bridge_net

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bridge_user
      POSTGRES_PASSWORD: bridge_pass
      POSTGRES_DB: bridge
      POSTGRES_HOST: postgres
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE}
    volumes:
      - ./backups:/backups
      - ~/.config/rclone:/root/.config/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c 'apk add --no-cache rclone openssl && echo "0 3 * * * TS=\$$(date +\%Y\%m\%d_\%H\%M\%S) && pg_dump -h \$$POSTGRES_HOST -U \$$POSTGRES_USER -d \$$POSTGRES_DB -Fc > /backups/db-\$$TS.dump && if [ -n \"\$$BACKUP_ENCRYPTION_KEY\" ]; then openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_ENCRYPTION_KEY -in /backups/db-\$$TS.dump -out /backups/db-\$$TS.dump.enc && rm /backups/db-\$$TS.dump; fi && if [ -n \"\$$BACKUP_RCLONE_REMOTE\" ]; then rclone copy /backups/db-\$$TS.dump* \$$BACKUP_RCLONE_REMOTE; fi && find /backups/ -type f -mtime +7 -delete" > /etc/crontabs/root && crond -f'
    networks:
      - bridge_net

networks:
  bridge_net:

volumes:
  pgdata:
  redisdata:
